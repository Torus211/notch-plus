name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check timer and clipboard invariants
        run: |
          swiftc boringNotch/NotchPlusCore.swift Tests/CoreChecks.swift -o /tmp/notchplus-checks
          /tmp/notchplus-checks
